# Render.com Blueprint — 5G-NTN Disaster Handover Simulator
services:
  - type: web
    name: ntn-disaster-sim
    runtime: python
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build && cd ..
      pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
    autoDeploy: true
